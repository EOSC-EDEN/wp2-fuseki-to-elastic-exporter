services:
  fuseki-backend:
    image: secoresearch/fuseki:latest
    environment:
      JAVA_OPTIONS: "-Xmx2048m -Xms2048m"
    volumes:
      - fuseki-data:/fuseki-base/databases
      - ./docker/fuseki/configuration:/fuseki-base/configuration
      - ./docker/fuseki/shiro.ini:/fuseki-base/shiro.ini
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q --spider http://localhost:3030/$/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  fuseki:
    build:
      context: ./docker/fuseki-proxy
    ports:
      - "3030:3030"
    environment:
      FUSEKI_BACKEND_HOST: fuseki-backend
      FUSEKI_BACKEND_PORT: "3030"
      PROXY_PORT: "3030"
      REDIS_URL: redis://redis:6379
      REDIS_CHANNEL: fuseki:graph-changed
    depends_on:
      fuseki-backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.0
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      xpack.security.enabled: "false"
      http.cors.enabled: "true"
      http.cors.allow-origin: "/https?:\\/\\/localhost(:[0-9]+)?/"
      http.cors.allow-headers: "X-Requested-With,Content-Type,Content-Length,Authorization,x-elastic-client-meta"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eden_exporter
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    image: dansknaw/eden-exporter:latest
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      FUSEKI_ENDPOINT: http://fuseki:3030/eden
      FUSEKI_USERNAME: ${FUSEKI_USERNAME:-admin}
      FUSEKI_PASSWORD: ${FUSEKI_PASSWORD:-admin}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/eden_exporter
      REDIS_HOST: redis
    depends_on:
      fuseki:
        condition: service_started
      elasticsearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  harvester:
    image: dansknaw/eden-harvester:0.0.3
    ports:
      - "8080:8080"
    environment:
      FUSEKI_PATH: http://fuseki:3030/eden/data
      FUSEKI_USERNAME: ${FUSEKI_USERNAME:-admin}
      FUSEKI_PASSWORD: ${FUSEKI_PASSWORD:-admin}
      FAIRSHARING_USERNAME: ${FAIRSHARING_USERNAME:-}
      FAIRSHARING_PASSWORD: ${FAIRSHARING_PASSWORD:-}
    depends_on:
      fuseki:
        condition: service_started
    restart: unless-stopped

  registry-attributes-service:
    build: ../attributes/eden-wp2-registry-attributes-service
    image: eden-wp2-registry-attributes-service
    ports:
      - "8000:8000"
    environment:
      REGISTRY_FUSEKI_SPARQL_ENDPOINT: http://fuseki:3030/eden/sparql
      REGISTRY_FUSEKI_USERNAME: ${FUSEKI_USERNAME:-admin}
      REGISTRY_FUSEKI_PASSWORD: ${FUSEKI_PASSWORD:-admin}
    depends_on:
      fuseki:
        condition: service_started
    restart: unless-stopped

volumes:
  fuseki-data:
  elasticsearch-data:
  postgres-data:
  redis-data:
