services:
  fuseki:
    image: secoresearch/fuseki:latest
    ports:
      - "3030:3030"
    environment:
      JAVA_OPTIONS: "-Xmx2048m -Xms2048m"
    volumes:
      - fuseki-data:/fuseki-base/databases
      - ./docker/fuseki/configuration:/fuseki-base/configuration
      - ./docker/fuseki/shiro.ini:/fuseki-base/shiro.ini
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q --spider http://localhost:3030/$/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.0
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eden_exporter
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rdf-delta:
    image: conjecto/rdf-delta:latest
    ports:
      - "1066:1066"
    volumes:
      - rdf-delta-data:/var/lib/rdf-delta
    depends_on:
      fuseki:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O /dev/null http://localhost:1066/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    image: dansknaw/eden-exporter:latest
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      FUSEKI_ENDPOINT: http://fuseki:3030/eden
      FUSEKI_USERNAME: ${FUSEKI_USERNAME:-admin}
      FUSEKI_PASSWORD: ${FUSEKI_PASSWORD:-admin}
      RDF_DELTA_URL: http://rdf-delta:1066
      ELASTICSEARCH_URL: http://elasticsearch:9200
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/eden_exporter
      REDIS_HOST: redis
    depends_on:
      fuseki:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rdf-delta:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  harvester:
    image: dansknaw/eden-harvester:latest
    build:
      context: ../wp2-repo-harvester
    ports:
      - "8080:8080"
    environment:
      FUSEKI_PATH: http://fuseki:3030/eden/data
      FUSEKI_USERNAME: ${FUSEKI_USERNAME:-admin}
      FUSEKI_PASSWORD: ${FUSEKI_PASSWORD:-admin}
      FAIRSHARING_USERNAME: ${FAIRSHARING_USERNAME:-}
      FAIRSHARING_PASSWORD: ${FAIRSHARING_PASSWORD:-}
    depends_on:
      fuseki:
        condition: service_healthy
    restart: unless-stopped

volumes:
  fuseki-data:
  elasticsearch-data:
  postgres-data:
  redis-data:
  rdf-delta-data:
